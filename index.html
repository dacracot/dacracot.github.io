<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<!-- =========================================================================== -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<link rel="apple-touch-icon" href="smash.png"/>
	<meta name="apple-mobile-web-app-capable" content="yes"/>
	<meta name="apple-mobile-web-app-status-bar-style" content="black"/>

	<title>Baby Smash</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color:black;
			font-family: Arial, Helvetica, sans-serif;
			}
		img {
			height:180px;
			width:180px;
			border-radius: 4px;
			border: 2px solid #555555;
			}
	</style>
</head>
<body onclick="boop();">
<dialog id="menu" onclick="this.close()" style="top:20%;">
	<button class="accordion">Guided Access</button>
	<div class="panel">
	  <p style="padding: 18px; width: 90%; margin: auto;">If necessary, avoid your little one exiting Baby Smash<br/>
		by following the instructions for <a href="https://www.youtube.com/watch?v=fzBi3EzfTRw">Apple's Guided Access</a>.</p>
	</div>
	
	<button class="accordion">Add Faces</button>
	<div class="panel">
	  <p>
		<form>
			<label for="nameInput">Name:</label>
			<input type="text" id="nameInput"/>
			<br/><br/>
			<label for="fileInput">Face:</label>
			<input type="file" id="fileInput" accept="image/*"/>
			<br/><hr/>
			<button onclick="addFile();">Submit</button>
		</form>
	  </p>
	</div>
	
	<button class="accordion">Remove Faces</button>
	<div class="panel">
	  <p>
		<table>
			<thead>
				<tr>
					<th>Name</th>
					<th>Face</th>
				</tr>
			</thead>
			<tbody>
				<tr class="deletion">
					<td>xxxx</td>
					<td>yyyy</td>
				</tr>
				<tr class="deletion">
					<td>xxxx</td>
					<td>yyyy</td>
				</tr>
				<tr class="deletion">
					<td>xxxx</td>
					<td>yyyy</td>
				</tr>
			</tbody>
		</table>
	  </p>
	</div>
	<table>
		<tr>
			<td><img onclick="mode=0;" src="Shapes/shapes.png"/></td>
			<td><img onclick="mode=3;" src="Faces/faces.png"/></td>
		</tr>
		<tr>
			<td><img onclick="mode=1;" src="Digits/digits.png"/></td>
			<td><img onclick="mode=2;" src="Letters/letters.png"/></td>
		</tr>
	</table>	
</dialog>
<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 600 600"
	width="600"
	height="600">
	<g id="screen"></g>
</svg>
</body>
<link rel="stylesheet" href="Library/oat.min.css">
<script src="Library/oat.min.js" defer></script>

</html>
